services:
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
    networks:
      - campus-network
    depends_on:
      - user-service
      - product-service
      - order-service

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      USER_SERVICE_PORT: 3001
      MONGODB_URI: mongodb://user-db:27017/userdb
    networks:
      - campus-network
    depends_on:
      - user-db

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      PRODUCT_SERVICE_PORT: 3002
      MONGODB_URI: mongodb://product-db:27017/productdb
    networks:
      - campus-network
    depends_on:
      - product-db

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      ORDER_SERVICE_PORT: 3003
      MONGODB_URI: mongodb://order-db:27017/orderdb
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    networks:
      - campus-network
    depends_on:
      - order-db
      - user-service
      - product-service

  user-db:
    image: mongo:latest
    container_name: user-db
    volumes:
      - user-mongo-data:/data/db
    networks:
      - campus-network

  product-db:
    image: mongo:latest
    container_name: product-db
    volumes:
      - product-mongo-data:/data/db
    networks:
      - campus-network

  order-db:
    image: mongo:latest
    container_name: order-db
    volumes:
      - order-mongo-data:/data/db
    networks:
      - campus-network

networks:
  campus-network:
    name: campus-network
    driver: bridge

volumes:
  user-mongo-data:
  product-mongo-data:
  order-mongo-data:
